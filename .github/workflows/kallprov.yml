name: Källprov

# Prövar nya källor (robots.txt och flödet) innan de läggs i feeds.yaml. Skriver inget till repot.
on:
  workflow_dispatch:
    inputs:
      adresser:
        description: "Flödesadresser, åtskilda med mellanslag"
        required: false
        default: ""
      alla:
        description: "true = gå igenom hela källistan mot utgivarnas robots.txt (hämtar inga flöden)"
        required: false
        default: "false"
      inbaddningar:
        description: "true = mät flerspråkiga inbäddningar mot dagens klustring på de handmärkta rubrikerna (installerar torch och sentence-transformers, skriver inget till repot)"
        required: false
        default: "false"
      jamfor:
        description: "Jämför alternativ A och B: källornas id som får bara rubrik i B (kör pipelinen med modellen två gånger, skriver inget till repot)"
        required: false
        default: ""
      sida:
        description: "Källa utan flöde: adressen till sidan med rubriklistan"
        required: false
        default: ""
      gdelt:
        description: "true = kontrollera händelserna som påstås saknas i svenska medier mot GDELT (skriver inget till repot)"
        required: false
        default: "false"
      rendera:
        description: "Källa utan flöde: true om sidan ritar sin lista med JavaScript (hämtas med webbläsare)"
        required: false
        default: "false"
      monster:
        description: "Källa utan flöde: reguljärt uttryck som nyhetslänkarnas sökväg ska matcha (tomt visar bara sökvägarna)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prova:
    if: ${{ inputs.jamfor == '' && inputs.inbaddningar != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pröva källorna
        env:
          ADRESSER: ${{ inputs.adresser }}
          SIDA: ${{ inputs.sida }}
          MONSTER: ${{ inputs.monster }}
          ALLA: ${{ inputs.alla }}
          RENDERA: ${{ inputs.rendera }}
          GDELT: ${{ inputs.gdelt }}
        run: |
          if [ "$ALLA" = "true" ]; then python kallprov.py --alla; fi
          if [ "$GDELT" = "true" ]; then python gdelt.py; fi
          if [ -n "$ADRESSER" ]; then python kallprov.py $ADRESSER; fi
          if [ -n "$SIDA" ]; then
            if [ "$RENDERA" = "true" ]; then python kallprov.py --sida "$SIDA" "$MONSTER" --rendera; else python kallprov.py --sida "$SIDA" "$MONSTER"; fi
          fi

  jamfor:
    # Alternativ A (ingress från alla källor, som idag) mot B (bara rubrik för de angivna källorna), samma flöden, två körningar med modellen.
    if: ${{ inputs.jamfor != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Alternativ A, som idag
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p /tmp/A /tmp/B
          python pipeline.py --out /tmp/A
      - name: Alternativ B, bara rubrik för de utvalda källorna
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NN_BARA_RUBRIK: ${{ inputs.jamfor }}
        run: python pipeline.py --out /tmp/B
      - name: Jämförelse
        env:
          KALLOR: ${{ inputs.jamfor }}
        run: |
          python jamfor_alternativ.py /tmp/A/flode.json /tmp/B/flode.json "$KALLOR" | tee jamforelse.txt
          { echo '## Alternativ A mot B'; echo '```'; cat jamforelse.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  inbaddningar:
    # Experiment: flerspråkiga inbäddningar (sentence-transformers) mot dagens klustring, mätt på tests/kluster-rubriker.json.
    if: ${{ inputs.inbaddningar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Installera torch (cpu) och sentence-transformers
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers
      - name: Mät
        run: |
          python inbaddningar.py | tee inbaddningar.txt
          { echo '## Inbäddningar mot dagens klustring'; echo '```'; cat inbaddningar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
