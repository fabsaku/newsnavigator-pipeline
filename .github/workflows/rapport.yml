name: Rapport

# Morgonrapporten kl 07.00 (samma lista som Behöver dig, som mejl) och varningsmejl direkt när något gått sönder.
# Klockan startar den 07.00; GitHubs scheman är reserv och vakthund varje timme, så att ett stopp i klockan också syns.
# Mejlet skickas en gång per dag och varningen en gång per fel (och igen efter tolv timmar), enligt data/rapport.json.
on:
  schedule:
    - cron: "5 5,6 * * *"    # 07.05 svensk tid, sommar och vinter
    - cron: "47 * * * *"     # vakthund varje timme
  workflow_dispatch:
    inputs:
      torrt:
        description: "Skriv ut mejlet i loggen i stället för att skicka det"
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

concurrency:
  group: newsnavigator
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyyaml
      - name: Räkna ut Behöver dig och mejla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RAPPORT_TILL: ${{ secrets.RAPPORT_TILL }}
          NN_RAPPORT_FRAN: ${{ vars.NN_RAPPORT_FRAN }}
        run: python behover.py --skicka ${{ inputs.torrt && '--torrt' || '' }}
      - name: Spara status
        run: |
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/rapport.json
          git commit -m "Rapport $(date -u +%Y-%m-%dT%H:%M)" || echo "Inget nytt"
          git pull --rebase -X theirs origin main && git push
