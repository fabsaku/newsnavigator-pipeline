name: Ångra

# Tar bort en publicerad notis: ur godkända och arkivet, spärrad för autopiloten, Instagram-inlägget om det går.
# Sajten och Navigatorn byggs om direkt.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Notisens id (tio tecken)"
        required: true

permissions:
  contents: write

concurrency:
  group: newsnavigator
  cancel-in-progress: false

jobs:
  angra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ångra
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: python autopilot.py angra "${{ inputs.id }}"
      - name: Bygg om Navigatorn, sajten och korten
        run: |
          python newsletter.py
          python publish.py
          python instagram.py bygg
      - name: Spara
        run: |
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site public
          git commit -m "Ångrat ${{ inputs.id }}" || echo "Inget nytt"
          git pull --rebase -X theirs origin main && git push
      - name: Uppdatera sajten om det publika har ändrats
        run: |
          git fetch origin sajt || true
          NEW=$(git rev-parse HEAD:public)
          OLD=$(git rev-parse origin/sajt^{tree} 2>/dev/null || echo none)
          if [ "$NEW" != "$OLD" ]; then
            git push -f origin "$(git commit-tree $NEW -m "Sajt $(date -u +%Y-%m-%dT%H:%M)")":refs/heads/sajt
          else
            echo "Sajten oförändrad"
          fi
