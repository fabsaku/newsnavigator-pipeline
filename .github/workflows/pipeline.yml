name: Newsnavigator pipeline

on:
  schedule:
    - cron: "17 * * * *"   # varje timme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kontrollera källor
        run: python verify_feeds.py
      - name: Kör pipelinen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py
      - name: Spara resultat
        run: |
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site
          git commit -m "Flöde $(date -u +%Y-%m-%dT%H:%M)" || echo "Inget nytt"
          git push
