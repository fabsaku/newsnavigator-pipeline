name: Newsnavigator pipeline

on:
  schedule:
    # En gång per dygn, i två steg (UTC). Första körningen hämtar och lägger notiser i autopilotens kö,
    # andra publicerar dem vars vetofönster (45 minuter) gått ut. Två korta körningar per dygn ryms i
    # de 2 000 Actions-minuter som ingår per månad; varje timme gjorde det inte.
    - cron: "17 3 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      kor:
        description: "true = kör på riktigt. Starter utan detta (klockan i Cloudflare) hoppas över."
        default: "false"

permissions:
  contents: write
  issues: write

concurrency:
  group: newsnavigator
  cancel-in-progress: false

jobs:
  run:
    # PAUSAT till 1 december (Actions-minuterna är slut). Ta bort `false && ` för att starta.
    if: ${{ false && (github.event_name == 'schedule' || inputs.kor == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Starttid
        run: echo "NN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Flerspråkig modell för hybridklustringen (semantisk.py)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers
        continue-on-error: true         # utan modell används klustren som de är
      - name: Modellens cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2
      - name: Kontrollera källor (dygnets första körning)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
        run: python verify_feeds.py
      - name: Läs godkännanden från granskningsärendet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python granskning_github.py las || echo "Kunde inte läsa ärendet"
      - name: Kör pipelinen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py
      - name: Bygg Navigatorn
        run: python newsletter.py
      - name: Bygg publika sajten (bara granskat)
        run: python publish.py
      - name: Instagramkort för godkända notiser
        run: python instagram.py bygg
      - name: Behöver dig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python behover.py || echo "Kunde inte räkna ut Behöver dig"
      - name: Uppdatera granskningsärendet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python granskning_github.py uppdatera || echo "Kunde inte uppdatera ärendet"
      - name: Driftstatus
        run: python drift.py pipeline ${{ job.status }}
      - name: Spara resultat
        run: |
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site public
          git commit -m "Flöde $(date -u +%Y-%m-%dT%H:%M)" || echo "Inget nytt"
          git pull --rebase -X theirs origin main && git push
      - name: Uppdatera sajten om det publika har ändrats
        run: |
          git fetch origin sajt || true
          NEW=$(git rev-parse HEAD:public)
          OLD=$(git rev-parse origin/sajt^{tree} 2>/dev/null || echo none)
          if [ "$NEW" != "$OLD" ]; then
            git push -f origin "$(git commit-tree $NEW -m "Sajt $(date -u +%Y-%m-%dT%H:%M)")":refs/heads/sajt
          else
            echo "Sajten oförändrad"
          fi
      - name: Driftstatus när körningen fallerar
        if: failure() || cancelled()
        run: |
          python3 drift.py pipeline ${{ job.status }}
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/drift.json
          git commit -m "Drift $(date -u +%Y-%m-%dT%H:%M): pipeline ${{ job.status }}"
          git rebase --abort 2>/dev/null || true
          git pull --rebase -X theirs --autostash origin main && git push
