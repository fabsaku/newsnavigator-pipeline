name: Newsnavigator pipeline

on:
  schedule:
    # Tider i UTC. Varje timme 06-23 svensk sommartid (05-22 vintertid), två körningar natten.
    - cron: "17 4-21 * * *"
    - cron: "17 0,2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kontrollera källor (nattkörningarna)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0,2 * * *'
        run: python verify_feeds.py
      - name: Kör pipelinen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py
      - name: Bygg Navigatorn
        run: python newsletter.py
      - name: Bygg publika sajten (bara granskat)
        run: python publish.py
      - name: Spara resultat
        run: |
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site public
          git commit -m "Flöde $(date -u +%Y-%m-%dT%H:%M)" || echo "Inget nytt"
          git pull --rebase origin main && git push
      - name: Uppdatera sajten om det publika har ändrats
        run: |
          git fetch origin sajt || true
          NEW=$(git rev-parse HEAD:public)
          OLD=$(git rev-parse origin/sajt^{tree} 2>/dev/null || echo none)
          if [ "$NEW" != "$OLD" ]; then
            git push -f origin "$(git commit-tree $NEW -m "Sajt $(date -u +%Y-%m-%dT%H:%M)")":refs/heads/sajt
          else
            echo "Sajten oförändrad"
          fi
