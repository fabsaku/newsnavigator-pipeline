name: Jämför källor

# Jämför alternativ A (ingress från alla källor, som idag) och B (bara rubrik för källor som stänger ute Claude i robots.txt).
# Kör pipelinen med modellen två gånger på samma flöden och skriver jämförelsen i körningens sammanfattning. Skriver inget till repot.
on:
  workflow_dispatch:
    inputs:
      kallor:
        description: "Källornas id (feeds.yaml) som får bara rubrik i alternativ B"
        default: "svt,sr-ekot,nrk,guardian,france24,spiegel,politico-eu,thehill,cnbc,thehindu,aljazeera,mit-tr,verge,techcrunch,ieee-robotics,fz,wired-ai,huffpost,vox,nypost,daily-caller,rest-of-world,ieee-spectrum,nation-ke,yonhap,rappler,abc-au,rnz,dr,ruv,eltiempo,theeastafrican,eurasianet"

permissions:
  contents: read

concurrency:
  group: jamfor-kallor
  cancel-in-progress: false

jobs:
  jamfor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Alternativ A, som idag
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p /tmp/A /tmp/B
          python pipeline.py --out /tmp/A
      - name: Alternativ B, bara rubrik för de utvalda källorna
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NN_BARA_RUBRIK: ${{ github.event.inputs.kallor }}
        run: python pipeline.py --out /tmp/B
      - name: Jämförelse
        env:
          KALLOR: ${{ github.event.inputs.kallor }}
        run: |
          python jamfor_alternativ.py /tmp/A/flode.json /tmp/B/flode.json "$KALLOR" | tee jamforelse.txt
          { echo '## Alternativ A mot B'; echo '```'; cat jamforelse.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
