name: Prova kandidatkällor

on:
  workflow_dispatch:
  push:
    paths: ["kandidater/feeds.yaml"]

permissions:
  contents: write

concurrency:
  group: newsnavigator
  cancel-in-progress: false

jobs:
  run:
    if: false   # PAUSAT 11 november på Fabians begäran. Ta bort raden för att starta igen.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python verify_feeds.py --feeds kandidater/feeds.yaml --out kandidater
      - name: Spara resultatet
        run: |
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add kandidater/kallstatus.json
          git commit -m "Kandidatkällor provade $(date -u +%Y-%m-%dT%H:%M)" || echo "Inget nytt"
          git pull --rebase origin main && git push
