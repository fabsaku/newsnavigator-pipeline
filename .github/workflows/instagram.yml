name: Instagram

# Postar dagens bästa godkända notis som karusell. Bilderna ligger redan ute på sajten (public/ig/).
# Schemat postar bara när repo-variabeln IG_SCHEMA är 1, så att secrets inte ensamma startar postningen före lanseringen.
on:
  schedule:
    - cron: "45 5 * * *"    # en gång per dygn: 07:45 svensk sommartid, 06:45 vintertid, efter dygnets pipeline
  workflow_dispatch:
    inputs:
      antal:
        description: "Antal notiser att posta per konto"
        default: "1"
      konto:
        description: "Vilket konto: sv (@newsnavigator.se), en (@news.navigator) eller alla"
        default: "alla"
      kor:
        description: "true = kör på riktigt. Starter utan detta (klockan i Cloudflare) hoppas över."
        default: "false"
      kontroll:
        description: "true = bara kontrollera att token och konto stämmer och visa kvoten (läser, postar inget)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: newsnavigator
  cancel-in-progress: false

jobs:
  posta:
    # PAUSAT till 1 december: bara kontrollen (postar inget) får köras. Ta bort `false && ` för att starta.
    if: ${{ inputs.kontroll == 'true' || (false && (github.event_name == 'schedule' || inputs.kor == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Starttid
        run: echo "NN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Posta
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          if [ "${{ github.event.inputs.kontroll }}" = "true" ]; then
            python instagram.py kontroll
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.IG_SCHEMA }}" != "1" ]; then
            echo "Schemat postar inte: repo-variabeln IG_SCHEMA är inte 1 (sätts efter lanseringen)"
          else
            python instagram.py posta --antal ${{ github.event.inputs.antal || '1' }} --konto ${{ github.event.inputs.konto || 'alla' }}
          fi
      - name: Driftstatus
        run: python drift.py instagram ${{ job.status }}
      - name: Spara status
        run: |
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/instagram data/drift.json
          git commit -m "Instagram $(date -u +%Y-%m-%dT%H:%M)" || echo "Inget nytt"
          git pull --rebase -X theirs origin main && git push
      - name: Driftstatus när körningen fallerar
        if: failure() || cancelled()
        run: |
          python3 drift.py instagram ${{ job.status }}
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/drift.json
          git commit -m "Drift $(date -u +%Y-%m-%dT%H:%M): instagram ${{ job.status }}"
          git rebase --abort 2>/dev/null || true
          git pull --rebase -X theirs --autostash origin main && git push
