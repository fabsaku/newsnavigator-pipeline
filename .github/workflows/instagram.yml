name: Instagram

# Postar dagens bästa godkända notis som karusell. Bilderna ligger redan ute på sajten (public/ig/).
on:
  schedule:
    - cron: "45 5 * * *"    # 07:45 svensk sommartid, 06:45 vintertid
  workflow_dispatch:
    inputs:
      antal:
        description: "Antal notiser att posta per konto"
        default: "1"
      konto:
        description: "Vilket konto: sv (@newsnavigator.se), en (@news.navigator) eller alla"
        default: "alla"
      kontroll:
        description: "true = bara kontrollera att token och konto stämmer och visa kvoten (läser, postar inget)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: newsnavigator
  cancel-in-progress: false

jobs:
  posta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Starttid
        run: echo "NN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Posta
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          if [ "${{ github.event.inputs.kontroll }}" = "true" ]; then
            python instagram.py kontroll
          else
            python instagram.py posta --antal ${{ github.event.inputs.antal || '1' }} --konto ${{ github.event.inputs.konto || 'alla' }}
          fi
      - name: Driftstatus
        run: python drift.py instagram ${{ job.status }}
      - name: Spara status
        run: |
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/instagram data/drift.json
          git commit -m "Instagram $(date -u +%Y-%m-%dT%H:%M)" || echo "Inget nytt"
          git pull --rebase -X theirs origin main && git push
      - name: Driftstatus när körningen fallerar
        if: failure() || cancelled()
        run: |
          python3 drift.py instagram ${{ job.status }}
          git config user.name "newsnavigator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/drift.json
          git commit -m "Drift $(date -u +%Y-%m-%dT%H:%M): instagram ${{ job.status }}"
          git rebase --abort 2>/dev/null || true
          git pull --rebase -X theirs --autostash origin main && git push
