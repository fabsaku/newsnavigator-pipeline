# Newsnavigator källista v0.2
# Fält: id, namn, url, alternativ (reservadresser som prövas om url inte fungerar),
#       extra (fler flöden från samma källa), usa_lutning (AllSides betyg, bara amerikanska medier),
#       lanka (fast länk till läsare), hemsida (visas på källsidan när flödets adress inte är sajtens), bara_rubrik (använd aldrig ingressen), avsandare (filtrera flöde med flera nyhetsbrev),
#       amnen, sprak, typ (media/primar/forskning/kuraterat), betalvagg,
#       kuraterat = nyhetsbrev och topplistor som samlar andras nyheter. Räknas inte som oberoende källa.
#       land, region (sverige/norden/europa/usa/asien/mellanostern/afrika/global),
#       agare (privat/public-service/statlig/organisation), statskontrollerad (true = staten styr innehållet)
# Betalväggskällor används bara för rubrik och länk, aldrig för text.
# Statskontrollerade medier tas med för att visa hur olika stater berättar, och märks alltid tydligt.

